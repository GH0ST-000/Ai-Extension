name: Supply chain

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @project-x/api prisma:generate

      - name: Build api, dashboard, extension
        run: |
          pnpm --filter @project-x/api build
          pnpm --filter @project-x/dashboard build
          pnpm --filter @project-x/extension build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/projectx?schema=public
          OPENAI_API_KEY: sk-test-ci-placeholder
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: http://localhost:3001
          PLASMO_PUBLIC_API_URL: http://localhost:3001

      - name: SBOM — api
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: apps/api
          format: cyclonedx-json
          artifact-name: sbom-api-cyclonedx
          output-file: sbom-api.cdx.json

      - name: SBOM — dashboard
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: apps/dashboard
          format: cyclonedx-json
          artifact-name: sbom-dashboard-cyclonedx
          output-file: sbom-dashboard.cdx.json

      - name: SBOM — extension
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: apps/extension
          format: cyclonedx-json
          artifact-name: sbom-extension-cyclonedx
          output-file: sbom-extension.cdx.json

      - name: Upload SBOM bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cyclonedx-sbom-${{ github.sha }}
          path: |
            sbom-api.cdx.json
            sbom-dashboard.cdx.json
            sbom-extension.cdx.json
          retention-days: 90
