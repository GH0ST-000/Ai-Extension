<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Project X mark</title>
  <defs>
    <linearGradient id="plate" x1="20" y1="8" x2="108" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141C2E"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
  </defs>
  <!-- Soft squircle plate -->
  <rect width="128" height="128" rx="36" fill="url(#plate)"/>
  <!-- Subtle rim so it doesn't read as a hard square on light chrome chrome -->
  <rect x="3" y="3" width="122" height="122" rx="33" fill="none" stroke="#14B8A6" stroke-opacity="0.35" stroke-width="3"/>
  <!-- Crossing signal beams -->
  <g fill="none" stroke="#14B8A6" stroke-width="14" stroke-linecap="round">
    <path d="M36 36 L92 92"/>
    <path d="M92 36 L36 92"/>
  </g>
  <!-- Amber spark node -->
  <circle cx="92" cy="36" r="8" fill="#F59E0B"/>
  <circle cx="92" cy="36" r="3" fill="#FFF7ED" fill-opacity="0.92"/>
</svg>
